[package]
name = "j-update"
description = "UI-independent signed GitHub release updates and installer handoff."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
semver = "1"
sha2 = "0.10"
ed25519-dalek = "2.2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
getrandom = "0.3"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
