name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - name: Install software Vulkan driver
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends mesa-vulkan-drivers
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-fail-fast
        env:
          JVID_GPU_TESTS: required
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-linux
          path: tests/snapshots/*.png
          if-no-files-found: ignore

  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts
      - run: python3 scripts/i18n_check.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jvid-fonts
          key: noto-cjk-Sans2.004
      - run: pip install fonttools==4.65.0
      - run: python3 assets/subset-cjk.py
      - run: python3 assets/subset-cjk.py
      - run: git diff --exit-code assets
