# j-ui strings, English: the source and fallback for every language.
# Keys are `section.name`; see docs/translating.md.

[language]
# This language's own name, shown untranslated in every language's picker.
name = "English"

[panel]
more_tabs = "More Tabs"

[input]
search = "Search"

[color]
# A fully transparent colour.
none = "None"

[theme]
# A theme file that can't be read or parsed.
error = "Theme {path}: {error}"
# A color that isn't #RRGGBB; keep the notation as written.
bad_color = "`{value}` is not #RRGGBB"
# Where in a theme file it broke, and why.
at = "line {line}, column {column}: {error}"
# Built-in theme names.
dark = "Dark"
light = "Light"
high_contrast = "High Contrast"

